<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Painel Exclusivo do Fundador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #05030a; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .admin-card {
            background: linear-gradient(135deg, #1b0d26 0%, #0d0614 100%);
            border: 1px solid rgba(255, 42, 141, 0.6);
            border-radius: 24px; padding: 35px 25px; max-width: 400px; width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 30px rgba(255, 42, 141, 0.2);
            text-align: center;
        }

        .lock-icon { font-size: 2.5rem; margin-bottom: 12px; }
        h1 { font-size: 1.6rem; color: #ff2a8d; margin-bottom: 8px; font-weight: bold; }
        p.subtitle { color: #b19cd9; font-size: 0.8rem; margin-bottom: 25px; line-height: 1.4; }

        .input-field { width: 100%; background: #090614; border: 1px solid rgba(255, 42, 141, 0.4); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.85rem; margin-bottom: 12px; outline: none; }
        .input-field:focus { border-color: #ff2a8d; box-shadow: 0 0 10px rgba(255, 42, 141, 0.3); }

        .btn-admin { width: 100%; background: linear-gradient(45deg, #ff2a8d, #9c27b0); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.3s; margin-top: 5px; }
        .btn-admin:hover { opacity: 0.9; transform: scale(1.01); }

        .back-link { display: block; margin-top: 20px; color: #888; font-size: 0.75rem; text-decoration: none; transition: 0.2s; }
        .back-link:hover { color: #ff2a8d; }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="lock-icon">🔐</div>
        <h1>Área Restrita</h1>
        <p class="subtitle">Insira as credenciais de Fundador para aceder com privilégios totais.</p>

        <input type="email" id="admin-email" class="input-field" value="walysonfelipenascimento@gmail.com" readonly>
        <input type="password" id="admin-senha" class="input-field" placeholder="Palavra-passe de administrador">

        <button class="btn-admin" onclick="validarFundador()">Desbloquear Painel</button>

        <a href="index.html" class="back-link">← Voltar para a página pública</a>
    </div>

    <script>
        const SENHA_CORRETA_FUNDADOR = "74199024";

        function validarFundador() {
            let senha = document.getElementById('admin-senha').value;

            if (senha !== SENHA_CORRETA_FUNDADOR) {
                alert('E-mail ou palavra-passe de administrador incorretos!');
                return;
            }

            // Define a sessão de administrador e entra no feed com acesso total
            sessionStorage.setItem('flowscore_admin_logado', 'true');
            localStorage.setItem('flowscore_email', 'walysonfelipenascimento@gmail.com');
            window.location.href = 'comum.html';
        }
    </script>
</body>
</html>
