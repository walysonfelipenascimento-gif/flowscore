<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Painel do Fundador (Admin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090614; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .admin-card {
            background: linear-gradient(135deg, #1c102b 0%, #0d0a1a 100%);
            border: 1px solid rgba(255, 42, 141, 0.5);
            border-radius: 24px; padding: 30px 25px; max-width: 480px; width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 30px rgba(255, 42, 141, 0.2);
            text-align: center;
        }

        .crown-icon { font-size: 2.8rem; margin-bottom: 10px; }
        h1 { font-size: 1.7rem; color: #ff2a8d; margin-bottom: 5px; font-weight: bold; }
        p.subtitle { color: #aaa; font-size: 0.82rem; margin-bottom: 20px; }

        .auth-box { background: #110d21; border: 1px solid rgba(255, 42, 141, 0.3); border-radius: 16px; padding: 18px; text-align: left; margin-bottom: 15px; }
        .auth-box h3 { font-size: 0.9rem; color: #ff2a8d; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .input-field { width: 100%; background: #090614; border: 1px solid rgba(255, 42, 141, 0.3); border-radius: 10px; padding: 11px 12px; color: #fff; font-size: 0.85rem; margin-bottom: 12px; outline: none; }
        
        .btn-primary { width: 100%; background: linear-gradient(45deg, #ff2a8d, #d81b60); color: #fff; border: none; padding: 11px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.3s; margin-bottom: 8px; text-decoration: none; display: block; text-align: center; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.01); }

        .back-link { display: block; margin-top: 15px; font-size: 0.78rem; color: #888; text-decoration: none; transition: 0.2s; }
        .back-link:hover { color: #ff2a8d; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; text-align: left; }
        .stat-box { background: #090614; border: 1px solid rgba(255, 42, 141, 0.2); border-radius: 10px; padding: 10px; }
        .stat-box span { font-size: 0.75rem; color: #aaa; display: block; }
        .stat-box strong { font-size: 1.1rem; color: #ff2a8d; }
    </style>
</head>
<body>

    <!-- Identificação do Fundador -->
    <div class="admin-card" id="login-container">
        <div class="crown-icon">👑</div>
        <h1>Área Restrita</h1>
        <p class="subtitle">Painel de Controlo do Fundador</p>

        <div class="auth-box">
            <h3>🔒 Identificação de Fundador</h3>
            <input type="email" id="admin-email" class="input-field" placeholder="Insere o teu e-mail de Fundador">
            <button class="btn-primary" onclick="entrarAdmin()">Aceder ao Painel</button>
        </div>

        <a href="index.html" class="back-link">← Voltar para a página principal</a>
    </div>

    <!-- Painel de Controlo Completo -->
    <div class="admin-card" id="panel-container" style="display: none; text-align: left;">
        <div style="text-align: center; margin-bottom: 15px;">
            <div class="crown-icon">👑</div>
            <h1>Painel do Fundador</h1>
            <p class="subtitle">Gestão Total e Análise do FlowScore</p>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span>Total de Membros</span>
                <strong id="total-membros">0</strong>
            </div>
            <div class="stat-box">
                <span>Estado do Sistema</span>
                <strong style="color: #4caf50;">Ativo 🟢</strong>
            </div>
        </div>

        <div class="auth-box">
            <h3 style="color: #ff2a8d; margin-bottom: 10px;">⚙️ Ferramentas de Controlo</h3>
            <button class="btn-primary" onclick="verMembros()">👥 Análise Completa de Membros</button>
            <button class="btn-primary" onclick="analisePlanos()" style="background: #7b1fa2;">📊 Análise de Planos e Cargos</button>
            <button class="btn-primary" onclick="verBio()" style="background: #0288d1;">📝 Ver / Editar Bio do Fundador</button>
            <button class="btn-primary" onclick="limparDadosSistema()" style="background: #b71c1c; margin-top: 10px;">🗑️ Reiniciar Dados do Sistema</button>
            <button class="btn-primary" onclick="sairAdmin()" style="background: #333;">🚪 Terminar Sessão</button>
        </div>

        <a href="index.html" class="back-link" style="text-align: center; display: block;">Ir para a página principal</a>
    </div>

    <script>
        const EMAIL_FUNDADOR = "walysonfelipenascimento@gmail.com";

        window.onload = function() {
            if (sessionStorage.getItem('flowscore_admin_logado') === 'true' || localStorage.getItem('flowscore_email') === EMAIL_FUNDADOR) {
                ativarPainelAdmin();
            }
        };

        function entrarAdmin() {
            let emailInput = document.getElementById('admin-email').value.trim().toLowerCase();

            if (emailInput === EMAIL_FUNDADOR) {
                sessionStorage.setItem('flowscore_admin_logado', 'true');
                localStorage.setItem('flowscore_email', EMAIL_FUNDADOR);
                ativarPainelAdmin();
            } else {
                alert('⚠️ Acesso Negado! Este e-mail não pertence ao Fundador do FlowScore.');
            }
        }

        function ativarPainelAdmin() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('panel-container').style.display = 'block';
            
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
            document.getElementById('total-membros').innerText = membros.length;
        }

        function verMembros() {
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
            if (membros.length === 0) {
                alert('Ainda não existem membros registados no sistema.');
                return;
            }
            let lista = membros.map(m => `• ${m.email} — [${m.status || 'Membro Comum'}]`).join('\n');
            alert('👥 ANÁLISE DE MEMBROS:\n\n' + lista);
        }

        function analisePlanos() {
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
            let comuns = membros.filter(m => !m.vip && m.status !== 'Fundador').length;
            let vips = membros.filter(m => m.vip).length;
            
            alert(`📊 ANÁLISE DE PLANOS:\n\n• Membros Comuns: ${comuns}\n• Membros VIP / Especiais: ${vips}\n• Total Geral: ${membros.length}`);
        }

        function verBio() {
            let bioAtual = localStorage.getItem('flowscore_bio') || 'Fundador e Criador Oficial do FlowScore - O império das comunidades.';
            let novaBio = prompt('📝 Bio atual do Fundador:\n\n' + bioAtual + '\n\nQueres atualizar a tua bio? Escreve a nova abaixo:');
            
            if (novaBio !== null && novaBio.trim() !== '') {
                localStorage.setItem('flowscore_bio', novaBio.trim());
                alert('✅ Bio atualizada com sucesso!');
            }
        }

        function sairAdmin() {
            sessionStorage.removeItem('flowscore_admin_logado');
            localStorage.removeItem('flowscore_email');
            window.location.href = 'index.html';
        }

        function limparDadosSistema() {
            if (confirm('⚠️ Tens a certeza absoluta que queres limpar todos os dados armazenados do sistema?')) {
                localStorage.clear();
                alert('🧹 Sistema reiniciado com sucesso!');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
