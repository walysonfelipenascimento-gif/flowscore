<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Painel Administrativo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0c20; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .header-nav { width: 100%; max-width: 500px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .header-nav a { color: #fff; background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .header-nav a.active { border-color: #9b59b6; background: rgba(155, 89, 182, 0.15); font-weight: bold; }

        .card-container {
            background: linear-gradient(135deg, #1f1a3a 0%, #141126 100%);
            border: 2px solid #9b59b6;
            border-radius: 20px; padding: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(155, 89, 182, 0.3);
            margin-bottom: 20px; text-align: center;
        }
        h2 { font-size: 1.5rem; margin-bottom: 8px; color: #e056fd; }
        p.subtitle { color: #d1b3ff; font-size: 0.8rem; margin-bottom: 20px; }

        .btn-action { width: 100%; background: linear-gradient(45deg, #9b59b6, #8e44ad); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; margin-bottom: 12px; transition: 0.3s; }
        .btn-action:hover { opacity: 0.9; }
        .btn-danger { background: linear-gradient(45deg, #c0392b, #e74c3c); }

        #mensagem-bloqueio { color: #e74c3c; font-weight: bold; font-size: 0.9rem; padding: 20px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="comum.html">Feed Fila</a>
        <a href="vip.html">Área VIP ⭐</a>
        <a href="exclusivo.html">Exclusivo 👑</a>
        <a href="planos.html">Planos 🪙</a>
        <a href="admin.html" class="active">Painel Admin ⚙️</a>
    </div>

    <div id="mensagem-bloqueio">
        Acesso restrito! Apenas o Administrador pode visualizar este painel.
    </div>

    <div class="card-container" id="painel-admin-conteudo" style="display: none;">
        <h2>⚙️ Gestão Administrativa</h2>
        <p class="subtitle">Bem-vindo, Walyson. Controlo total do sistema.</p>
        
        <button class="btn-action" onclick="liberarTudoVip()">Forçar VIP Ativo para Testes Globais</button>
        <button class="btn-action btn-danger" onclick="limparBancoLocal()">Apagar Todos os Dados Locais</button>
        <button class="btn-action" onclick="window.location.href='comum.html'" style="background: rgba(255,255,255,0.1);">Voltar ao Feed</button>
    </div>

    <script>
        window.onload = function() {
            let email = localStorage.getItem('flowscore_email');
            if (!email) { email = 'walysonfelipenascimento@gmail.com'; localStorage.setItem('flowscore_email', email); }

            let isAdmin = email.trim().toLowerCase() === 'walysonfelipenascimento@gmail.com';
            
            if (isAdmin) {
                document.getElementById('painel-admin-conteudo').style.display = 'block';
                document.getElementById('mensagem-bloqueio').style.display = 'none';
                localStorage.setItem('flowscore_vip_ativo', 'true');
            } else {
                document.getElementById('painel-admin-conteudo').style.display = 'none';
                document.getElementById('mensagem-bloqueio').style.display = 'block';
            }
        };

        function liberarTudoVip() {
            localStorage.setItem('flowscore_vip_ativo', 'true');
            alert('Status VIP/Realeza ativado com sucesso para este navegador!');
        }

        function limparBancoLocal() {
            if (confirm('Tens certeza absoluta que queres limpar todos os dados salvos?')) {
                localStorage.clear();
                alert('Dados limpos com sucesso.');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
