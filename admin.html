<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Painel Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090614; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header-nav {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.03); padding: 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); width: 100%; max-width: 600px;
        }
        .header-nav a {
            color: #fff; text-decoration: none; font-size: 0.8rem; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s;
        }
        .header-nav a:hover, .header-nav a.active { background: rgba(255, 42, 141, 0.2); border-color: #ff2a8d; }

        .card-container {
            background: linear-gradient(135deg, #16102a 0%, #0d0a1a 100%);
            border: 1px solid rgba(255, 42, 141, 0.3); border-radius: 16px; padding: 25px; max-width: 500px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
        }
        h2 { color: #ff2a8d; margin-bottom: 10px; font-size: 1.5rem; }
        p.subtitle { color: #aaa; font-size: 0.85rem; margin-bottom: 20px; }
        
        .btn-action {
            display: block; width: 100%; background: linear-gradient(45deg, #ff2a8d, #d81b60); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; margin-bottom: 12px; transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .stats-box { background: #090614; border: 1px solid rgba(255, 42, 141, 0.2); border-radius: 10px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .stats-box span { color: #aaa; font-size: 0.8rem; display: block; }
        .stats-box strong { color: #ff2a8d; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Cabeçalho de Navegação idêntico ao resto do site -->
    <div class="header-nav">
        <a href="comum.html">Feed Flow 📁</a>
        <a href="vip.html">Área VIP 👑</a>
        <a href="exclusivo.html">Exclusivo ✨</a>
        <a href="planos.html">Planos 🪙</a>
        <a href="admin.html" id="nav-admin-link" class="active" style="border-color: #ff2a8d; color: #ff2a8d;">Painel Admin ⚙️</a>
    </div>

    <div class="card-container">
        <h2>Painel do Fundador</h2>
        <p class="subtitle">Gestão e controlo geral do sistema FlowScore</p>

        <div class="stats-box">
            <span>Membros Registados no Sistema:</span>
            <strong id="admin-total-membros">0</strong>
        </div>

        <button class="btn-action" onclick="verListaMembros()">👥 Ver Lista de Membros</button>
        <button class="btn-action" onclick="limparSistema()" style="background: linear-gradient(45deg, #b71c1c, #d32f2f);">🗑️ Reiniciar Dados do Sistema</button>
    </div>

    <script>
        window.onload = function() {
            let email = localStorage.getItem('flowscore_email') || '';
            
            // Validação rigorosa do Administrador/Fundador igual aos outros scripts do teu projeto
            if (email.trim().toLowerCase() !== 'walysonfelipenascimento@gmail.com') {
                alert('⚠️ Acesso restrito apenas ao Fundador!');
                window.location.href = 'index.html';
                return;
            }

            // Exibir link do admin se aplicável
            document.getElementById('nav-admin-link').style.display = 'inline-block';

            // Carregar dados estatísticos
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
            document.getElementById('admin-total-membros').innerText = membros.length;
        };

        function verListaMembros() {
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
            if (membros.length === 0) {
                alert('Ainda não existem membros registados.');
                return;
            }
            let lista = membros.map(m => `• ${m.email} (${m.status || 'Comum'})`).join('\n');
            alert('Membros Atuais:\n\n' + lista);
        }

        function limparSistema() {
            if (confirm('Tens a certeza que queres limpar os dados do sistema?')) {
                localStorage.clear();
                alert('Dados limpos com sucesso.');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
