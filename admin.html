<!-- Exemplo do bloco de publicação no painel do Admin -->
<div class="card-container" style="background: #141126; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); max-width: 500px; width: 100%; margin-bottom: 20px;">
    <h3 style="color: #fff; margin-bottom: 10px; font-size: 1.1rem;">📝 Publicar Comunicado / Post (Até 3000 chars)</h3>
    
    <select id="post-section" style="width:100%; padding: 10px; margin-bottom: 10px; background: #0f0c20; color: #fff; border: 1px solid #444; border-radius: 8px;">
        <option value="comum">Feed Comum / Fila</option>
        <option value="vip">Área VIP ⭐</option>
        <option value="exclusivo">Exclusivo 👑</option>
    </select>

    <input type="text" id="post-link" placeholder="Link do Instagram / Vídeo (Opcional)" style="width:100%; padding: 10px; margin-bottom: 10px; background: #0f0c20; color: #fff; border: 1px solid #444; border-radius: 8px;">
    
    <textarea id="post-text" maxlength="3000" placeholder="Escreva a mensagem aqui (máximo 3000 caracteres)..." style="width:100%; height: 120px; padding: 10px; background: #0f0c20; color: #fff; border: 1px solid #444; border-radius: 8px; resize: none;"></textarea>
    
    <button onclick="criarPostAdmin()" style="width:100%; padding: 10px; background: #2ecc71; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px;">Publicar no Feed</button>
</div>

<script>
function criarPostAdmin() {
    let section = document.getElementById('post-section').value;
    let link = document.getElementById('post-link').value;
    let texto = document.getElementById('post-text').value;

    if (!texto.trim()) {
        alert('Escreva algum texto para publicar.');
        return;
    }

    let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
    posts.unshift({
        section: section,
        link: link,
        texto: texto,
        autor: localStorage.getItem('flowscore_email') || 'Administrador'
    });

    localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
    alert('Publicação efetuada com sucesso!');
    document.getElementById('post-text').value = '';
    document.getElementById('post-link').value = '';
}
</script>
