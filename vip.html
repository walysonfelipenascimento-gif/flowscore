<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Área VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0c20; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .header-nav { width: 100%; max-width: 500px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .header-nav a { color: #fff; background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .header-nav a.active { border-color: #f39c12; background: rgba(243, 156, 18, 0.15); font-weight: bold; }

        .card-container {
            background: linear-gradient(135deg, #1f1a3a 0%, #141126 100%);
            border: 1px solid rgba(243, 156, 18, 0.4);
            border-radius: 20px; padding: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(243, 156, 18, 0.15);
            margin-bottom: 20px; text-align: center;
        }
        h2 { font-size: 1.6rem; margin-bottom: 5px; background: linear-gradient(45deg, #f39c12, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #aaa; font-size: 0.8rem; }

        .publish-box { background: #141126; border: 1px solid #f39c12; border-radius: 16px; padding: 18px; max-width: 500px; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: none; }
        .publish-box h3 { font-size: 1rem; color: #f39c12; margin-bottom: 12px; }
        .input-field { width: 100%; background: #0a0814; border: 1px solid rgba(243, 156, 18, 0.3); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.8rem; margin-bottom: 12px; outline: none; }
        .btn-publicar { width: 100%; background: linear-gradient(45deg, #f39c12, #d35400); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        .post-card { background: #141126; border: 1px solid rgba(243, 156, 18, 0.4); border-radius: 16px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 500px; width: 100%; text-align: left; }
        .post-header { display: flex; align-items: center; padding: 14px 16px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(45deg, #f39c12, #d35400); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.95rem; color: #fff; }
        .post-user-info { font-size: 0.88rem; color: #fff; font-weight: bold; }
        .post-user-sub { font-size: 0.75rem; color: #f39c12; margin-top: 2px; }
        .media-box { background: #000; padding: 25px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .media-box p { font-size: 0.85rem; color: #ddd; margin-bottom: 8px; }
        .media-box a { font-size: 0.8rem; color: #f39c12; text-decoration: underline; word-break: break-all; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.2); }
        .post-impulses { font-size: 0.8rem; color: #aaa; }
        .btn-turbinar { background: transparent; border: 1px solid #f39c12; color: #f39c12; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-turbinar:hover { background: rgba(243, 156, 18, 0.15); }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="comum.html">Feed Fila</a>
        <a href="vip.html" class="active">Área VIP ⭐</a>
        <a href="exclusivo.html">Exclusivo 👑</a>
        <a href="planos.html">Planos & Moedas 🪙</a>
    </div>

    <div class="card-container">
        <h2>Feed VIP Exclusivo</h2>
        <p class="subtitle">Conteúdos e comunicados oficiais de alta prioridade.</p>
    </div>

    <!-- Visível apenas para o Admin ou quem tem plano VIP ativo -->
    <div class="publish-box" id="panel-publish">
        <h3>⭐ Adicionar Post VIP</h3>
        <input type="text" id="vip-link" class="input-field" placeholder="Link Direto da Publicação...">
        <input type="text" id="vip-text" class="input-field" placeholder="Escreva uma legenda ou descrição...">
        <button class="btn-publicar" onclick="publicarVip()">Publicar no Feed VIP</button>
    </div>

    <div style="max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center;" id="vip-timeline"></div>

    <script>
        window.onload = function() {
            let email = localStorage.getItem('flowscore_email');
            if (!email) { window.location.href = 'index.html'; return; }

            let isAdmin = (email === 'onlyzlicinhoszbb@gmail.com');
            let isVipAtivo = localStorage.getItem('flowscore_vip_ativo') === 'true';

            // Conector de permissão: Só libera a publicação se for Admin ou tiver o plano VIP ativo
            if (isAdmin || isVipAtivo) {
                document.getElementById('panel-publish').style.display = 'block';
            }

            carregarPostsVip();
        };

        function publicarVip() {
            let link = document.getElementById('vip-link').value.trim();
            let texto = document.getElementById('vip-text').value.trim();
            let email = localStorage.getItem('flowscore_email');
            let autor = (email === 'onlyzlicinhoszbb@gmail.com') ? 'Fundador ⭐ [VIP]' : 'Membro VIP';

            if (!texto && !link) { alert('Preencha pelo menos o link ou o texto.'); return; }

            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            posts.unshift({ id: Date.now(), section: 'vip', autor: autor, texto: texto || 'Publicação VIP', link: link, impulses: 0 });
            localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
            
            document.getElementById('vip-link').value = '';
            document.getElementById('vip-text').value = '';
            carregarPostsVip();
            alert('Publicação VIP efetuada com sucesso!');
        }

        function carregarPostsVip() {
            const timeline = document.getElementById('vip-timeline');
            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            let vipPosts = posts.filter(p => p.section === 'vip');

            if (vipPosts.length === 0) {
                timeline.innerHTML = `<div class="card-container"><p style="color:#aaa;">Nenhuma publicação VIP no momento. Adquira o VIP na aba Planos para poder publicar!</p></div>`;
                return;
            }

            timeline.innerHTML = '';
            vipPosts.forEach((p) => {
                let avatarLetra = p.autor ? p.autor.charAt(0) : 'V';
                timeline.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-avatar">${avatarLetra}</div>
                            <div>
                                <div class="post-user-info">${p.autor}</div>
                                <div class="post-user-sub">${p.texto}</div>
                            </div>
                        </div>
                        ${p.link ? `<div class="media-box"><p>Publicação vinculada</p><a href="${p.link}" target="_blank">${p.link}</a></div>` : ''}
                        <div class="post-footer">
                            <span class="post-impulses">🚀 ${p.impulses || 0} impulsos</span>
                            <button class="btn-turbinar" onclick="turbinarVip(${p.id})">Turbinar (-5 🪙)</button>
                        </div>
                    </div>`;
            });
        }

        function turbinarVip(id) {
            let moedas = parseInt(localStorage.getItem('flowscore_coins')) || 0;
            if (moedas < 5) { alert('Moedas insuficientes!'); return; }
            moedas -= 5;
            localStorage.setItem('flowscore_coins', moedas);

            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            let post = posts.find(p => p.id === id);
            if (post) {
                post.impulses = (post.impulses || 0) + 1;
                localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
                carregarPostsVip();
                alert('Post impulsionado com sucesso!');
            }
        }
    </script>
</body>
</html>
