<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Exclusivo Realeza 👑</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090614; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .header-nav { width: 100%; max-width: 500px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .header-nav a { color: #fff; background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .header-nav a.active { border-color: #9b59b6; background: rgba(155, 89, 182, 0.2); font-weight: bold; }

        .card-container {
            background: linear-gradient(135deg, #1e1233 0%, #0e091b 100%);
            border: 1px solid rgba(155, 89, 182, 0.5);
            border-radius: 20px; padding: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(155, 89, 182, 0.25);
            margin-bottom: 20px; text-align: center;
        }
        h2 { font-size: 1.5rem; margin-bottom: 5px; color: #e056fd; }
        p.subtitle { color: #d1b3ff; font-size: 0.8rem; }

        /* Caixa de publicação de realeza */
        .publish-box { background: #110c1f; border: 1px solid #9b59b6; border-radius: 16px; padding: 18px; max-width: 500px; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; text-align: left; }
        .publish-box h3 { font-size: 1rem; color: #e056fd; margin-bottom: 12px; }
        .input-field { width: 100%; background: #07040e; border: 1px solid rgba(155, 89, 182, 0.3); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.8rem; margin-bottom: 12px; outline: none; }
        .btn-publicar { width: 100%; background: linear-gradient(45deg, #9b59b6, #e056fd); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        /* Cartão de post realeza */
        .post-card { background: #110c1f; border: 1px solid rgba(155, 89, 182, 0.5); border-radius: 16px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 500px; width: 100%; text-align: left; }
        .post-header { display: flex; align-items: center; padding: 14px 16px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(155, 89, 182, 0.05); }
        .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(45deg, #9b59b6, #f1c40f); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.95rem; color: #fff; }
        .post-user-info { font-size: 0.88rem; color: #fff; font-weight: bold; }
        .post-user-sub { font-size: 0.75rem; color: #e056fd; margin-top: 2px; }

        .media-box { background: #000; padding: 20px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .media-box p { font-size: 0.8rem; color: #e2d9f3; margin-bottom: 6px; }
        .media-box a { font-size: 0.78rem; color: #e056fd; text-decoration: underline; word-break: break-all; }

        .post-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.3); }
        .post-impulses { font-size: 0.8rem; color: #d1b3ff; }
        .btn-turbinar { background: transparent; border: 1px solid #e056fd; color: #e056fd; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-turbinar:hover { background: rgba(224, 86, 253, 0.15); }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="comum.html">Feed Fila</a>
        <a href="vip.html">Área VIP ⭐</a>
        <a href="exclusivo.html" class="active">Exclusivo 👑</a>
        <a href="planos.html">Planos 🪙</a>
        <a href="admin.html" id="nav-admin-link" style="display:none; border-color:#9b59b6; color:#e056fd;">Painel Admin ⚙️</a>
    </div>

    <div class="card-container">
        <h2>Canal Imperial do Criador</h2>
        <p class="subtitle">Conteúdos solenes e publicações oficiais em estilo de realeza.</p>
    </div>

    <!-- Caixa para adicionar links e posts (Aparece para Admin ou Realeza) -->
    <div class="publish-box" id="panel-publish-royal">
        <h3>👑 Adicionar Post / Link Imperial</h3>
        <input type="text" id="royal-link" class="input-field" placeholder="Link Direto (Ex: https://...)">
        <input type="text" id="royal-text" class="input-field" placeholder="Pronunciamento ou descrição imperial...">
        <button class="btn-publicar" onclick="publicarRoyal()">Publicar no Canal Imperial</button>
    </div>

    <div style="max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center;" id="royal-timeline"></div>

    <script>
        window.onload = function() {
            let email = localStorage.getItem('flowscore_email');
            if (!email) { email = 'walysonfelipenascimento@gmail.com'; localStorage.setItem('flowscore_email', email); }

            let isAdmin = email.trim().toLowerCase() === 'walysonfelipenascimento@gmail.com';
            let isRoyal = localStorage.getItem('flowscore_vip_ativo') === 'true';

            if (isAdmin || isRoyal) {
                document.getElementById('panel-publish-royal').style.display = 'block';
                if (isAdmin) document.getElementById('nav-admin-link').style.display = 'inline-block';
            }

            carregarPostsRoyal();
        };

        function publicarRoyal() {
            let link = document.getElementById('royal-link').value.trim();
            let texto = document.getElementById('royal-text').value.trim();
            let email = localStorage.getItem('flowscore_email');
            let autor = (email.trim().toLowerCase() === 'walysonfelipenascimento@gmail.com') ? 'Fundador 👑 [Realeza]' : 'Membro Realeza';

            if (!texto && !link) { alert('Insira pelo menos um link ou um texto imperial.'); return; }

            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            posts.unshift({
                id: Date.now(),
                section: 'exclusivo',
                autor: autor,
                texto: texto || 'Pronunciamento Imperial Oficial',
                link: link,
                impulses: 0
            });

            localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
            document.getElementById('royal-link').value = '';
            document.getElementById('royal-text').value = '';
            carregarPostsRoyal();
            alert('Publicação Imperial efetuada com sucesso!');
        }

        function carregarPostsRoyal() {
            const timeline = document.getElementById('royal-timeline');
            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            let royalPosts = posts.filter(p => p.section === 'exclusivo');

            if (royalPosts.length === 0) {
                timeline.innerHTML = `<div class="card-container"><p style="color:#d1b3ff;">Nenhuma publicação exclusiva no momento.</p></div>`;
                return;
            }

            timeline.innerHTML = '';
            royalPosts.forEach((p) => {
                let avatarLetra = p.autor ? p.autor.charAt(0) : 'R';
                timeline.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-avatar">${avatarLetra}</div>
                            <div>
                                <div class="post-user-info">${p.autor}</div>
                                <div class="post-user-sub">${p.texto}</div>
                            </div>
                        </div>
                        ${p.link ? `
                        <div class="media-box">
                            <p>Publicação vinculada</p>
                            <a href="${p.link}" target="_blank">${p.link}</a>
                        </div>` : ''}
                        <div class="post-footer">
                            <span class="post-impulses">🚀 ${p.impulses || 0} impulsos</span>
                            <button class="btn-turbinar" onclick="turbinarRoyal(${p.id})">Turbinar (-15 🪙)</button>
                        </div>
                    </div>`;
            });
        }

        function turbinarRoyal(id) {
            let moedas = parseInt(localStorage.getItem('flowscore_coins')) || 0;
            // Custo triplicado: 15 moedas para turbinar posts exclusivos
            if (moedas < 15) { alert('Moedas insuficientes! Os posts exclusivos custam 15 moedas para turbinar.'); return; }
            moedas -= 15;
            localStorage.setItem('flowscore_coins', moedas);

            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            let post = posts.find(p => p.id === id);
            if (post) {
                post.impulses = (post.impulses || 0) + 1;
                localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
                carregarPostsRoyal();
                alert('Post imperial impulsionado com sucesso (-15 moedas)!');
            }
        }
    </script>
</body>
</html>
