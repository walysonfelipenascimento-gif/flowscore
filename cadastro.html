<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Criar Conta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #0f0c20; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-container {
            background: linear-gradient(135deg, #19152e 0%, #141126 100%);
            border: 1px solid rgba(193, 53, 132, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(193, 53, 132, 0.2);
        }

        h2 { 
            font-size: 2rem; 
            margin-bottom: 5px;
            text-align: center;
            background: linear-gradient(45deg, #ff3399, #c13584, #833ab4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { text-align: center; color: #b3b3b3; font-size: 0.85rem; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; }

        label { display: block; font-size: 0.85rem; color: #ddd; margin-bottom: 6px; }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        input:focus { border-color: #ff3399; }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: rgba(193, 53, 132, 0.1);
            border: 1px solid rgba(193, 53, 132, 0.3);
            padding: 12px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 0.85rem;
            color: #ccc;
        }

        .checkbox-group input { margin-top: 3px; accent-color: #ff3399; }

        .checkbox-group a { color: #ff3399; text-decoration: underline; font-weight: bold; }

        .btn-submit { 
            width: 100%;
            background: linear-gradient(45deg, #ff3399, #c13584);
            color: #fff;
            border: none;
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.3);
        }

        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }

        .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #888; }
        .footer-link a { color: #ff3399; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card-container">
        <h2>Criar Conta</h2>
        <p class="subtitle">Cadastre-se para começar a acumular moedas e entrar nos fluxos.</p>

        <form action="comum.html">
            <div class="form-group">
                <label>Nome Completo / Nickname</label>
                <input type="text" placeholder="Ex: Walyson" required>
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" placeholder="seuemail@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="seguir" required>
                <label for="seguir">
                    Eu declaro que já sigo o criador no canal/perfil oficial para ter direito às filas e recompensas.
                </label>
            </div>

            <button type="submit" class="btn-submit">Finalizar Cadastro</button>
        </form>

        <div class="footer-link">
            Já tem uma conta? <a href="login.html">Fazer Login</a>
        </div>
    </div>

</body>
</html>
