<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Feed Estilo Instagram</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #0f0c20; 
            color: #fff; 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-nav {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .header-nav a {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .header-nav a.active {
            border-color: #ff3399;
            background: rgba(255, 51, 153, 0.15);
            font-weight: bold;
        }

        .card-container {
            background: linear-gradient(135deg, #19152e 0%, #141126 100%);
            border: 1px solid rgba(193, 53, 132, 0.3);
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(193, 53, 132, 0.2);
            margin-bottom: 20px;
        }

        h2 { 
            font-size: 1.6rem; 
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff3399, #c13584, #833ab4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle { text-align: center; color: #aaa; font-size: 0.8rem; margin-bottom: 15px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-card h3 { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: #ff3399; }

        .form-group { margin-bottom: 10px; text-align: left; }
        label { display: block; font-size: 0.8rem; color: #ddd; margin-bottom: 4px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }
        input:focus { border-color: #ff3399; }

        .btn-action { 
            width: 100%;
            background: linear-gradient(45deg, #ff3399, #c13584);
            color: #fff;
            border: none;
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            text-align: center;
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Estilo do Feed Estilo Instagram */
        .insta-post-card {
            background: #141126;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .insta-post-card.vip-feed {
            border-color: #ff3399;
            box-shadow: 0 0 15px rgba(255, 51, 153, 0.2);
        }
        .insta-header {
            display: flex;
            align-items: center;
            padding: 12px;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .insta-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .insta-user-info { font-size: 0.8rem; color: #fff; font-weight: bold; }
        .insta-user-sub { font-size: 0.7rem; color: #888; }

        .insta-embed-container {
            width: 100%;
            background: #000;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .insta-body {
            padding: 12px;
        }
        .insta-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #aaa;
        }
        .boost-btn {
            background: rgba(255, 51, 153, 0.2);
            border: 1px solid #ff3399;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .boost-btn:hover { background: rgba(255, 51, 153, 0.4); }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="comum.html" class="active">Feed Fila</a>
        <a href="vip.html">Área VIP</a>
        <a href="exclusivo.html">Exclusivo</a>
        <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
    </div>

    <div class="card-container">
        <h2>Feed de Divulgação</h2>
        <p class="subtitle" id="user-greeting">Cole o link do seu post do Instagram para receber críticas e engajamento.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Suas Moedas</h3>
                <div class="stat-value" id="user-coins">🪙 15</div>
            </div>
            <div class="stat-card">
                <h3>Seu Status</h3>
                <div class="stat-value" id="user-tier" style="font-size: 1rem; margin-top: 4px;">Comum</div>
            </div>
        </div>
    </div>

    <!-- Enviar Link do Instagram -->
    <div class="card-container">
        <h3 style="font-size: 1rem; color: #ff3399; margin-bottom: 10px;">📸 Adicionar Post do Instagram</h3>
        
        <div class="form-group">
            <label>Link Direto da Publicação (Ex: https://www.instagram.com/p/...)</label>
            <input type="text" id="instaLink" placeholder="Cole o link do post aqui">
        </div>
        
        <button class="btn-action" onclick="adicionarPostInsta()">Publicar no Feed</button>
    </div>

    <!-- Feed Estilo Rolagem (Timeline) -->
    <div style="max-width: 500px; width: 100%;" id="feed-timeline">
        <!-- Os posts em formato de feed aparecem aqui -->
    </div>

    <script>
        const EMAIL_FUNDADOR = "walysonfelipenascimento@gmail.com";

        let moedas = parseInt(localStorage.getItem('flowscore_coins')) || 15;
        let postsInsta = JSON.parse(localStorage.getItem('flowscore_insta_posts')) || [
            { link: "https://www.instagram.com/", autor: "Fundador", vip: true, impulsionado: 3 }
        ];

        window.onload = function() {
            const emailSalvo = localStorage.getItem('flowscore_email');
            if (!emailSalvo) {
                window.location.href = 'index.html';
                return;
            }

            const greeting = document.getElementById('user-greeting');
            if (emailSalvo.toLowerCase() === EMAIL_FUNDADOR.toLowerCase()) {
                greeting.innerText = `Sessão: Fundador Walyson`;
                document.getElementById('nav-admin').style.display = 'inline-block';
                document.getElementById('user-tier').innerText = '👑 Fundador';
            } else {
                greeting.innerText = `Sessão: ${emailSalvo}`;
            }

            atualizarFeed();
        };

        function atualizarFeed() {
            document.getElementById('user-coins').innerText = `🪙 ${moedas}`;
            localStorage.setItem('flowscore_coins', moedas);
            localStorage.setItem('flowscore_insta_posts', JSON.stringify(postsInsta));

            const timeline = document.getElementById('feed-timeline');
            timeline.innerHTML = '';

            // Ordenar por VIP e impulsos
            postsInsta.sort((a, b) => (b.vip - a.vip) || (b.impulsionado - a.impulsionado));

            postsInsta.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = `insta-post-card ${p.vip ? 'vip-feed' : ''}`;
                
                // Formatar link limpo para exibição ou iframe caso seja válido
                div.innerHTML = `
                    <div class="insta-header">
                        <div class="insta-avatar">${p.autor.charAt(0).toUpperCase()}</div>
                        <div>
                            <div class="insta-user-info">${p.autor} ${p.vip ? '⭐ [VIP]' : ''}</div>
                            <div class="insta-user-sub">Post para avaliação e críticas</div>
                        </div>
                    </div>
                    <div class="insta-embed-container">
                        <div style="text-align: center; padding: 20px;">
                            <p style="font-size: 0.85rem; color: #ccc; margin-bottom: 10px;">Publicação vinculada do Instagram</p>
                            <a href="${p.link}" target="_blank" style="color: #ff3399; font-size: 0.85rem; word-break: break-all;">${p.link}</a>
                        </div>
                    </div>
                    <div class="insta-body">
                        <div class="insta-actions">
                            <span>🚀 ${p.impulsionado} impulsos</span>
                            <button class="boost-btn" onclick="turbinarFeed(${index})">Turbinar (-5 🪙)</button>
                        </div>
                    </div>
                `;
                timeline.appendChild(div);
            });
        }

        function adicionarPostInsta() {
            const link = document.getElementById('instaLink').value.trim();
            const emailSalvo = localStorage.getItem('flowscore_email');

            if (!link || !link.includes('instagram.com')) {
                alert('Por favor, insira um link válido do Instagram!');
                return;
            }

            const isVip = emailSalvo.toLowerCase() === EMAIL_FUNDADOR.toLowerCase();

            postsInsta.unshift({
                link: link,
                autor: emailSalvo.split('@')[0],
                vip: isVip,
                impulsionado: 0
            });

            document.getElementById('instaLink').value = '';
            atualizarFeed();
            alert('Post adicionado ao feed com sucesso para receber interações!');
        }

        function turbinarFeed(index) {
            if (moedas < 5) {
                alert('Você não tem moedas suficientes para turbinar este post!');
                return;
            }
            moedas -= 5;
            postsInsta[index].impulsionado += 1;
            atualizarFeed();
            alert('Post turbinado com sucesso! Subiu no feed.');
        }
    </script>

</body>
</html>
