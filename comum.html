<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Feed de Divulgação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090614; color: #fff; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .header-nav { width: 100%; max-width: 500px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .header-nav a { color: #fff; background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 12px; text-decoration: none; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .header-nav a.active { border-color: #ff2a8d; background: rgba(255, 42, 141, 0.15); font-weight: bold; }

        .card-container {
            background: linear-gradient(135deg, #16102a 0%, #0d0a1a 100%);
            border: 1px solid rgba(255, 42, 141, 0.3);
            border-radius: 20px; padding: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255, 42, 141, 0.1);
            margin-bottom: 20px; text-align: center;
        }
        h2 { font-size: 1.5rem; margin-bottom: 5px; color: #ff2a8d; }
        p.subtitle { color: #aaa; font-size: 0.78rem; margin-bottom: 15px; }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .status-box { background: #110d21; border: 1px solid rgba(255, 42, 141, 0.2); border-radius: 14px; padding: 12px; text-align: center; }
        .status-box span { font-size: 0.75rem; color: #aaa; display: block; margin-bottom: 4px; }
        .status-box strong { font-size: 1rem; color: #ff2a8d; }

        /* Botões para alternar as listas de membros */
        .members-nav { display: flex; gap: 8px; margin-top: 10px; }
        .btn-tab { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 42, 141, 0.3); color: #fff; padding: 8px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-tab.active { background: rgba(255, 42, 141, 0.2); border-color: #ff2a8d; font-weight: bold; }

        .members-list-box { background: #110d21; border: 1px solid rgba(255, 42, 141, 0.2); border-radius: 14px; padding: 12px; margin-top: 10px; text-align: left; max-height: 150px; overflow-y: auto; display: none; }
        .member-item { font-size: 0.78rem; color: #ddd; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; }
        .member-item span.vip-badge { color: #f1c40f; font-weight: bold; }

        /* Caixa de publicação fiel ao design original + suporte a texto longo */
        .publish-box { background: #16102a; border: 1px solid #ff2a8d; border-radius: 16px; padding: 18px; max-width: 500px; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: left; }
        .publish-box h3 { font-size: 1rem; color: #ff2a8d; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .input-field { width: 100%; background: #090614; border: 1px solid rgba(255, 42, 141, 0.3); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.8rem; margin-bottom: 10px; outline: none; }
        textarea.input-field { resize: vertical; min-height: 80px; }
        .btn-publicar { width: 100%; background: linear-gradient(45deg, #ff2a8d, #d81b60); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        /* Cartões de posts */
        .post-card { background: #110d21; border: 1px solid rgba(255, 42, 141, 0.4); border-radius: 16px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 500px; width: 100%; text-align: left; }
        .post-header { display: flex; align-items: center; padding: 14px 16px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(45deg, #ff2a8d, #f1c40f); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.95rem; color: #fff; }
        .post-user-info { font-size: 0.88rem; color: #fff; font-weight: bold; }
        .post-user-sub { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

        .media-box { background: #000; padding: 25px 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .media-box p { font-size: 0.85rem; color: #ccc; margin-bottom: 6px; }
        .media-box a { font-size: 0.78rem; color: #ff2a8d; text-decoration: underline; word-break: break-all; }

        .post-text-content { padding: 15px 16px; font-size: 0.85rem; color: #e2d9f3; line-height: 1.4; word-break: break-word; white-space: pre-wrap; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .post-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.2); }
        .post-impulses { font-size: 0.8rem; color: #aaa; }
        .btn-turbinar { background: transparent; border: 1px solid #ff2a8d; color: #ff2a8d; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-turbinar:hover { background: rgba(255, 42, 141, 0.15); }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="comum.html" class="active">Feed Fila</a>
        <a href="vip.html">Área VIP ⭐</a>
        <a href="exclusivo.html">Exclusivo 👑</a>
        <a href="planos.html">Planos 🪙</a>
        <a href="admin.html" id="nav-admin-link" style="display:none; border-color:#9b59b6; color:#e056fd;">Admin ⚙️</a>
    </div>

    <div class="card-container">
        <h2>Feed de Divulgação</h2>
        <p class="subtitle">Sessão: <span id="user-session-name">Fundador Walyson</span></p>
        
        <div class="status-grid">
            <div class="status-box">
                <span>Suas Moedas</span>
                <strong id="user-coins">30 🪙</strong>
            </div>
            <div class="status-box">
                <span>Seu Status</span>
                <strong id="user-status-text">👑 Fundador</strong>
            </div>
        </div>

        <!-- Botões de Listagem de Membros -->
        <div class="members-nav">
            <button class="btn-tab" onclick="alternarLista('geral')">👥 Membros Gerais</button>
            <button class="btn-tab" onclick="alternarLista('planos')">⭐ Membros em Planos</button>
        </div>

        <div class="members-list-box" id="box-lista-geral">
            <div id="conteudo-lista-geral">A carregar membros...</div>
        </div>

        <div class="members-list-box" id="box-lista-planos">
            <div id="conteudo-lista-planos">A carregar membros VIP...</div>
        </div>
    </div>

    <!-- Caixa de publicação idêntica à foto de referência -->
    <div class="publish-box">
        <h3>📸 Adicionar Post do Instagram</h3>
        <input type="text" id="comum-link" class="input-field" placeholder="Cole o link do post aqui (Ex: https://www.instagram.com/p/...)">
        <textarea id="comum-text" class="input-field" maxlength="3000" placeholder="Escreva uma legenda ou mensagem (até 3000 caracteres)..."></textarea>
        <button class="btn-publicar" onclick="publicarComum()">Publicar no Feed</button>
    </div>

    <div style="max-width: 500px; width: 100%; display: flex; flex-direction: column; align-items: center;" id="comum-timeline"></div>

    <script>
        window.onload = function() {
            let email = localStorage.getItem('flowscore_email');
            if (!email) { email = 'walysonfelipenascimento@gmail.com'; localStorage.setItem('flowscore_email', email); }

            let moedas = localStorage.getItem('flowscore_coins');
            if (moedas === null) { moedas = 30; localStorage.setItem('flowscore_coins', moedas); }
            document.getElementById('user-coins').innerText = moedas + ' 🪙';

            let isAdmin = email.trim().toLowerCase() === 'walysonfelipenascimento@gmail.com';
            if (isAdmin) {
                document.getElementById('nav-admin-link').style.display = 'inline-block';
            }

            // Registar utilizador atual na lista de membros se não existir
            registarMembroAtual(email, isAdmin);

            carregarPostsComum();
            carregarListasMembros();
        };

        function registarMembroAtual(email, isAdmin) {
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
            let status = isAdmin ? 'Fundador / Admin' : (localStorage.getItem('flowscore_vip_ativo') === 'true' ? 'Membro VIP' : 'Membro Comum');
            let isVip = (isAdmin || localStorage.getItem('flowscore_vip_ativo') === 'true');

            let existente = membros.find(m => m.email === email);
            if (!existente) {
                membros.push({ email: email, status: status, vip: isVip });
            } else {
                existente.status = status;
                existente.vip = isVip;
            }
            localStorage.setItem('flowscore_membros', JSON.stringify(membros));
        }

        function alternarLista(tipo) {
            let boxGeral = document.getElementById('box-lista-geral');
            let boxPlanos = document.getElementById('box-lista-planos');

            if (tipo === 'geral') {
                if (boxGeral.style.display === 'block') {
                    boxGeral.style.display = 'none';
                } else {
                    boxGeral.style.display = 'block';
                    boxPlanos.style.display = 'none';
                }
            } else {
                if (boxPlanos.style.display === 'block') {
                    boxPlanos.style.display = 'none';
                } else {
                    boxPlanos.style.display = 'block';
                    boxGeral.style.display = 'none';
                }
            }
        }

        function carregarListasMembros() {
            let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [
                { email: 'walysonfelipenascimento@gmail.com', status: 'Fundador / Admin', vip: true }
            ];

            const divGeral = document.getElementById('conteudo-lista-geral');
            const divPlanos = document.getElementById('conteudo-lista-planos');

            divGeral.innerHTML = '';
            divPlanos.innerHTML = '';

            if (membros.length === 0) {
                divGeral.innerHTML = '<div class="member-item">Nenhum membro registado.</div>';
            }

            let membrosVipCount = 0;
            membros.forEach(m => {
                divGeral.innerHTML += `
                    <div class="member-item">
                        <span>${m.email}</span>
                        <span style="color:#ff2a8d;">${m.status}</span>
                    </div>`;

                if (m.vip) {
                    membrosVipCount++;
                    divPlanos.innerHTML += `
                        <div class="member-item">
                            <span>${m.email}</span>
                            <span class="vip-badge">⭐ Ativo (VIP/Realeza)</span>
                        </div>`;
                }
            });

            if (membrosVipCount === 0) {
                divPlanos.innerHTML = '<div class="member-item">Nenhum membro com plano ativo.</div>';
            }
        }

        function publicarComum() {
            let link = document.getElementById('comum-link').value.trim();
            let texto = document.getElementById('comum-text').value.trim();
            let email = localStorage.getItem('flowscore_email');
            let isAdmin = email.trim().toLowerCase() === 'walysonfelipenascimento@gmail.com';
            let autor = isAdmin ? 'Fundador 👑 [VIP]' : 'Membro';

            if (!texto && !link) { alert('Insira pelo menos o link do Instagram ou uma mensagem.'); return; }

            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            posts.unshift({
                id: Date.now(),
                section: 'comum',
                autor: autor,
                texto: texto || 'Post para avaliação e críticas',
                link: link,
                impulses: 0
            });

            localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
            document.getElementById('comum-link').value = '';
            document.getElementById('comum-text').value = '';
            carregarPostsComum();
            alert('Publicação efetuada com sucesso!');
        }

        function carregarPostsComum() {
            const timeline = document.getElementById('comum-timeline');
            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            let comumPosts = posts.filter(p => !p.section || p.section === 'comum');

            if (comumPosts.length === 0) {
                timeline.innerHTML = `<div class="card-container"><p style="color:#aaa;">Nenhuma publicação no feed comum no momento.</p></div>`;
                return;
            }

            timeline.innerHTML = '';
            comumPosts.forEach((p) => {
                let avatarLetra = p.autor ? p.autor.charAt(0) : 'F';
                timeline.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-avatar">${avatarLetra}</div>
                            <div>
                                <div class="post-user-info">${p.autor}</div>
                                <div class="post-user-sub">${p.texto ? p.texto.substring(0, 45) + (p.texto.length > 45 ? '...' : '') : 'Post para avaliação e críticas'}</div>
                            </div>
                        </div>
                        ${p.link ? `
                        <div class="media-box">
                            <p>Publicação vinculada do Instagram</p>
                            <a href="${p.link}" target="_blank">${p.link}</a>
                        </div>` : ''}
                        ${p.texto && p.link ? `<div class="post-text-content">${p.texto}</div>` : ''}
                        <div class="post-footer">
                            <span class="post-impulses">🚀 ${p.impulses || 0} impulsos</span>
                            <button class="btn-turbinar" onclick="turbinarComum(${p.id})">Turbinar (-5 🪙)</button>
                        </div>
                    </div>`;
            });
        }

        function turbinarComum(id) {
            let moedas = parseInt(localStorage.getItem('flowscore_coins')) || 0;
            if (moedas < 5) { alert('Moedas insuficientes!'); return; }
            moedas -= 5;
            localStorage.setItem('flowscore_coins', moedas);
            document.getElementById('user-coins').innerText = moedas + ' 🪙';

            let posts = JSON.parse(localStorage.getItem('flowscore_all_posts')) || [];
            let post = posts.find(p => p.id === id);
            if (post) {
                post.impulses = (post.impulses || 0) + 1;
                localStorage.setItem('flowscore_all_posts', JSON.stringify(posts));
                carregarPostsComum();
                alert('Post impulsionado com sucesso!');
            }
        }
    </script>
</body>
</html>
