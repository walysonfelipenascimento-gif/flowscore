<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Fila Comum e Mural</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #0f0c20; 
            color: #fff; 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .header-nav a {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .header-nav a.active {
            border-color: #ff3399;
            background: rgba(255, 51, 153, 0.15);
            font-weight: bold;
        }

        .card-container {
            background: linear-gradient(135deg, #19152e 0%, #141126 100%);
            border: 1px solid rgba(193, 53, 132, 0.3);
            border-radius: 20px;
            padding: 25px 20px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(193, 53, 132, 0.2);
            margin-bottom: 20px;
        }

        h2 { 
            font-size: 1.8rem; 
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff3399, #c13584, #833ab4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle { text-align: center; color: #aaa; font-size: 0.85rem; margin-bottom: 15px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h3 { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        .stat-value { font-size: 1.3rem; font-weight: bold; color: #ff3399; }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 0.85rem; color: #ddd; margin-bottom: 5px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        textarea { resize: vertical; height: 70px; }
        input:focus, textarea:focus { border-color: #ff3399; }

        .btn-action { 
            width: 100%;
            background: linear-gradient(45deg, #ff3399, #c13584);
            color: #fff;
            border: none;
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.3);
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); }

        .post-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            margin-top: 12px;
            text-align: left;
        }
        .post-item.vip-post {
            border-color: #ff3399;
            background: rgba(255, 51, 153, 0.05);
        }
        .post-desc { font-size: 0.9rem; color: #fff; margin-bottom: 8px; }
        .post-link { font-size: 0.8rem; color: #ff3399; word-break: break-all; display: block; margin-bottom: 10px; }
        
        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #888;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }
        .boost-btn {
            background: rgba(255, 51, 153, 0.2);
            border: 1px solid #ff3399;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .boost-btn:hover { background: rgba(255, 51, 153, 0.4); }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="comum.html" class="active">Fila Comum</a>
        <a href="vip.html">Área VIP</a>
        <a href="exclusivo.html">Exclusivo Criador</a>
        <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
    </div>

    <!-- Painel de Perfil e Moedas -->
    <div class="card-container">
        <h2>Fila Comum</h2>
        <p class="subtitle" id="user-greeting">Gerencie as suas publicações e engajamento.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Suas Moedas</h3>
                <div class="stat-value" id="user-coins">🪙 15</div>
            </div>
            <div class="stat-card">
                <h3>Seu Status</h3>
                <div class="stat-value" id="user-tier" style="font-size: 1.1rem; margin-top: 4px;">Comum</div>
            </div>
        </div>
    </div>

    <!-- Criar Publicação / Adicionar Link -->
    <div class="card-container">
        <h3 style="font-size: 1.1rem; color: #ff3399; margin-bottom: 12px;">➕ Adicionar Nova Publicação</h3>
        
        <div class="form-group">
            <label>Descrição do Conteúdo / Perfil</label>
            <input type="text" id="postDesc" placeholder="Ex: Sigam meu perfil de edição!">
        </div>
        <div class="form-group">
            <label>Link de Divulgação</label>
            <input type="text" id="postLink" placeholder="https://instagram.com/seu_perfil">
        </div>
        
        <button class="btn-action" onclick="criarPublicacao()">Publicar na Fila</button>
    </div>

    <!-- Mural de Publicações -->
    <div class="card-container">
        <h3 style="font-size: 1.1rem; color: #fff; margin-bottom: 10px;">🌐 Mural de Divulgação</h3>
        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 15px;">Interaja, acesse os links e turbine com moedas para subir de posição.</p>
        
        <div id="mural-posts">
            <!-- As publicações aparecem aqui dinamicamente -->
        </div>
    </div>

    <script>
        const EMAIL_FUNDADOR = "walysonfelipenascimento@gmail.com";

        // Carregar dados iniciais do localStorage ou criar padrão
        let moedas = parseInt(localStorage.getItem('flowscore_coins')) || 15;
        let publicacoes = JSON.parse(localStorage.getItem('flowscore_posts')) || [
            { desc: "Perfil oficial da plataforma - Sigam!", link: "https://instagram.com/onlyz.licinhosz_bb", autor: "Fundador", vip: true, impulsionado: 5 },
            { desc: "Conheça o meu canal de jogos e novidades!", link: "https://instagram.com", autor: "usuario@gmail.com", vip: false, impulsionado: 0 }
        ];

        window.onload = function() {
            const emailSalvo = localStorage.getItem('flowscore_email');
            
            if (!emailSalvo) {
                window.location.href = 'index.html';
                return;
            }

            const greeting = document.getElementById('user-greeting');
            if (emailSalvo.toLowerCase() === EMAIL_FUNDADOR.toLowerCase()) {
                greeting.innerText = `Sessão: Fundador Walyson`;
                document.getElementById('nav-admin').style.display = 'inline-block';
                document.getElementById('user-tier').innerText = '👑 Fundador';
            } else {
                greeting.innerText = `Sessão: ${emailSalvo}`;
            }

            atualizarInterface();
        };

        function atualizarInterface() {
            document.getElementById('user-coins').innerText = `🪙 ${moedas}`;
            localStorage.setItem('flowscore_coins', moedas);
            localStorage.setItem('flowscore_posts', JSON.stringify(publicacoes));

            const mural = document.getElementById('mural-posts');
            mural.innerHTML = '';

            // Ordenar publicações por nível VIP e quantidade de impulsos
            publicacoes.sort((a, b) => (b.vip - a.vip) || (b.impulsionado - a.impulsionado));

            publicacoes.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = `post-item ${p.vip ? 'vip-post' : ''}`;
                div.innerHTML = `
                    <div class="post-desc">${p.vip ? '⭐ [VIP] ' : ''}${p.desc}</div>
                    <a href="${p.link}" target="_blank" class="post-link">${p.link}</a>
                    <div class="post-footer">
                        <span>Por: ${p.autor} | 🚀 ${p.impulsionado} impulsos</span>
                        <button class="boost-btn" onclick="turbinarPost(${index})">Turbinar (-5 🪙)</button>
                    </div>
                `;
                mural.appendChild(div);
            });
        }

        function criarPublicacao() {
            const desc = document.getElementById('postDesc').value.trim();
            const link = document.getElementById('postLink').value.trim();
            const emailSalvo = localStorage.getItem('flowscore_email');

            if (!desc || !link) {
                alert('Por favor, preencha a descrição e o link!');
                return;
            }

            const isVip = emailSalvo.toLowerCase() === EMAIL_FUNDADOR.toLowerCase();

            publicacoes.unshift({
                desc: desc,
                link: link,
                autor: emailSalvo,
                vip: isVip,
                impulsionado: 0
            });

            document.getElementById('postDesc').value = '';
            document.getElementById('postLink').value = '';
            atualizarInterface();
            alert('Publicação enviada para o mural com sucesso!');
        }

        function turbinarPost(index) {
            if (moedas < 5) {
                alert('Você não tem moedas suficientes para turbinar! Interaja ou aguarde.');
                return;
            }
            moedas -= 5;
            publicacoes[index].impulsionado += 1;
            atualizarInterface();
            alert('Publicação turbinada com sucesso! Subiu no ranking.');
        }
    </script>

</body>
</html>
