<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Início</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #090614; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #110d21; border: 1px solid rgba(255, 42, 141, 0.3); border-radius: 20px; padding: 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff2a8d; margin-bottom: 15px; font-size: 1.8rem; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
        .btn { display: block; width: 100%; background: linear-gradient(45deg, #ff2a8d, #d81b60); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; margin-bottom: 10px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .input-field { width: 100%; background: #090614; border: 1px solid rgba(255, 42, 141, 0.3); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 0.85rem; margin-bottom: 12px; outline: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>FlowScore</h1>
        <p>Insere o teu e-mail para aceder ao sistema e gerir a tua conta.</p>
        
        <input type="email" id="user-email-input" class="input-field" placeholder="O teu e-mail...">
        <button class="btn" onclick="entrarSistema()">Aceder ao Sistema</button>
    </div>

    <script>
        function entrarSistema() {
            let email = document.getElementById('user-email-input').value.trim().toLowerCase();
            if (!email) {
                alert('Por favor, insere um e-mail válido.');
                return;
            }
            localStorage.setItem('flowscore_email', email);
            
            if (email === 'walysonfelipenascimento@gmail.com') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'comum.html';
            }
        }
    </script>
</body>
</html>
