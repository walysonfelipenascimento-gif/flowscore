<script>
    // VERIFICAÇÃO AUTOMÁTICA AO ABRIR O SITE:
    window.onload = function() {
        let emailSalvo = localStorage.getItem('flowscore_email');
        
        if (emailSalvo) {
            // Se já tem sessão guardada, entra direto sem mostrar a tela de login
            if (emailSalvo === 'walysonfelipenascimento@gmail.com') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'comum.html';
            }
        }
    };

    function marcouInstagram() {
        document.getElementById('check-insta-login').checked = true;
        document.getElementById('check-insta-registo').checked = true;
    }

    function entrarConta() {
        let email = document.getElementById('login-email').value.trim().toLowerCase();
        let senha = document.getElementById('login-senha').value;
        let seguiu = document.getElementById('check-insta-login').checked;

        if (!email || !senha) {
            alert('Por favor, preenche o e-mail e a senha.');
            return;
        }

        if (email === 'walysonfelipenascimento@gmail.com') {
            localStorage.setItem('flowscore_email', email);
            window.location.href = 'admin.html';
            return;
        }

        if (!seguiu) {
            alert('⚠️ ACESSO NEGADO! Tens de seguir @onlyz.licinhosz_bb no Instagram para aceder ao FlowScore.');
            return;
        }

        localStorage.setItem('flowscore_email', email);
        window.location.href = 'comum.html';
    }

    function criarConta() {
        let email = document.getElementById('registo-email').value.trim().toLowerCase();
        let senha = document.getElementById('registo-senha').value;
        let seguiu = document.getElementById('check-insta-registo').checked;

        if (!email || !senha) {
            alert('Por favor, preenche um e-mail e cria uma senha válidos.');
            return;
        }

        if (email === 'walysonfelipenascimento@gmail.com') {
            localStorage.setItem('flowscore_email', email);
            window.location.href = 'admin.html';
            return;
        }

        if (!seguiu) {
            alert('⚠️ ACESSO NEGADO! Para criar conta no FlowScore, tens de nos seguir primeiro no Instagram.');
            return;
        }

        localStorage.setItem('flowscore_email', email);
        if (localStorage.getItem('flowscore_coins') === null) {
            localStorage.setItem('flowscore_coins', '30');
        }

        let membros = JSON.parse(localStorage.getItem('flowscore_membros')) || [];
        if (!membros.some(m => m.email === email)) {
            membros.push({ email: email, status: 'Membro Comum', vip: false });
            localStorage.setItem('flowscore_membros', JSON.stringify(membros));
        }

        window.location.href = 'comum.html';
    }
</script>
