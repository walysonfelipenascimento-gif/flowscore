<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowScore - Plataforma de Engajamento</title>
    <style>
        /* Estilo Mar de Cores - Degradê Neon */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #0f0c20; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-container {
            background: linear-gradient(135deg, #19152e 0%, #141126 100%);
            border: 1px solid rgba(193, 53, 132, 0.3);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(193, 53, 132, 0.2);
        }

        h1 { 
            font-size: 2.8rem; 
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff3399, #c13584, #833ab4, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #b3b3b3; margin-bottom: 30px; font-size: 0.95rem; }

        .btn-container { 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            width: 100%;
        }

        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            color: #fff; 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 14px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            transition: all 0.3s ease;
        }

        .btn:hover { 
            background: linear-gradient(45deg, #c13584, #833ab4);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(193, 53, 132, 0.4);
        }

        .btn-primary { 
            background: linear-gradient(45deg, #ff3399, #c13584);
            border: none;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #c13584, #e1306c);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>FlowScore</h1>
        <p>Bem-vindo à plataforma oficial de engajamento e fluxos.</p>

        <div class="btn-container">
            <a href="login.html" class="btn btn-primary">Entrar na Conta</a>
            <a href="cadastro.html" class="btn">Criar Nova Conta</a>
            <a href="comum.html" class="btn">Acessar Fila Comum</a>
        </div>
    </div>

</body>
</html>
